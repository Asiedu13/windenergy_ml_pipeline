# NWP-feature variant of config.yaml.
#
# Adds archived day-ahead forecasts (Open-Meteo Previous Runs API) to the Stage 1
# feature set. Motivation, in one line: every feature in config.yaml is the
# atmospheric state at time t, and hub wind at t+24 is only 0.571 correlated with
# it — the models are information-limited, not sample-limited. See the learning
# curve in docs/07_findings_and_analysis.md.
#
#   python -m src.pipeline --config config_nwp.yaml --mode forecast
#
# ⚠️ The window differs from config.yaml. The Open-Meteo previous-runs archive is
# all-null before 2024-03 (verified for this site), so results from this config are
# NOT directly comparable to the v1–v4 tables in RESULTS.md, which are on
# 2020–2023. Re-run the baselines on this window before claiming an improvement.

site:
  name: anloga
  latitude: 5.79
  longitude: 0.90
  hub_height_m: 100

data:
  source: era5
  start: "2024-03-01"
  # Shortened from 2026-06-30 on 2026-08-11. ERA5 for this window downloads at
  # ~27 min/request (vs ~6 min for the 2010-2019 backfill), so the full 28 months
  # was ~32 h of queueing. 22 months leaves ~1.47 yr of training data after the
  # 80/20 split — just under the ~1.6 yr point where the learning curve in
  # docs/07 flattens, costing ~0.004 m/s while saving ~8 h.
  # The Open-Meteo forecast cache still covers 2024-03 -> 2026-06; the extra
  # months are simply sliced off, no re-fetch needed.
  end: "2025-12-31"
  cache_dir: data/raw

# Archived operational forecasts. ERA5 above remains the truth series and the
# source of the contemporaneous-state features; this block only adds forecasts.
nwp:
  enabled: true
  # Three independent global models — their spread is itself informative.
  models: [ecmwf_ifs025, gfs_global, icon_global]
  # _previous_day{N}: forecast issued N*24 h before the valid time. d1 is the
  # 24 h horizon this project forecasts; d2/d3 come free on the same request and
  # let the model see forecast consistency across lead times.
  lead_days: [1, 2, 3]
  variables:
    - wind_speed_100m
    - wind_direction_100m
    - wind_speed_10m
    - temperature_2m
    - surface_pressure
    - wind_gusts_10m

turbine:
  name: E-101/3050
  source: oedb

forecast:
  horizon_hours: 24
  timestep: hourly

# Identical to config.yaml so the comparison is like-for-like.
model:
  stage1_algo: xgboost
  test_split: 0.2
  cv_folds: 5
  lags: [1, 2, 3, 6, 12]
  rolling_windows: [3, 6]
  seed: 42
  tune_xgboost: true
  tune_n_trials: 50
  compare_algos: [xgboost, dlinear, lstm, nbeats, tft]
  deep:
    input_chunk_length: 48
    hidden_size: 64
    n_rnn_layers: 1
    batch_size: 128
    dropout: 0.2
    learning_rate: 0.001
    gradient_clip_val: 1.0
    loss_fn: mse
    include_target_lags: true
    n_epochs: 200
    val_fraction: 0.15
    early_stopping:
      enabled: true
      patience: 20
      min_delta: 0.0001
    scheduler:
      enabled: true
      warmup_epochs: 5
      min_lr_factor: 0.02
    lr_sweep:
      enabled: true
      candidates: [0.0003, 0.001, 0.003]
      epochs: 6
    nbeats:
      num_stacks: 3
      num_blocks: 3
      layer_widths: 256
    dlinear:
      kernel_size: 25
    overrides:
      nbeats:
        n_epochs: 100
        batch_size: 256
        early_stopping: {patience: 15}
        lr_sweep: {epochs: 4}
      tft:
        n_epochs: 60
        batch_size: 256
        early_stopping: {patience: 10}
        lr_sweep: {candidates: [0.0003, 0.001], epochs: 3}

paths:
  outputs: outputs
  processed: data/processed
